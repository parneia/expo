name: Swift ABI Check

on:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Swift ABI check
    if: contains(github.event.pull_request.labels.*.name, 'abi-check')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
      - name: ⬇️ Fetch commits from base branch
        run: git fetch origin ${{ github.base_ref }} --depth 100
      - name: 🔨 Switch to Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: 🔨 Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - name: 🔨 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: 📦 Install node modules
        run: pnpm install --frozen-lockfile
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🏗️ Precompile ExpoModulesCore and ExpoModulesJSI
        run: bin/expo-turbo run precompile-ios --filter=expo-modules-core --filter=expo-modules-jsi --cache=local:rw,remote:r
        env:
          RCT_HERMES_V1_ENABLED: '1'
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🔍 Compare the Swift ABI with the published versions
        id: abi
        shell: bash
        run: |
          et check-swift-abi --base-ref origin/${{ github.base_ref }} 2>&1 \
            | tee "$RUNNER_TEMP/swift-abi-output.txt"
      - name: 📝 Write the report to the job summary
        if: ${{ always() && steps.abi.outcome != 'skipped' }}
        run: |
          perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/swift-abi-output.txt" > "$RUNNER_TEMP/swift-abi-report.txt"
          {
            echo "## Swift ABI check: ${{ steps.abi.outcome }}"
            echo '```'
            cat "$RUNNER_TEMP/swift-abi-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 🔍 Find the previous ABI check comment
        if: ${{ always() && steps.abi.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: old_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'expo-bot'
          body-includes: <!-- swift-abi-check comment -->
      - name: 💬 Add or update the ABI check comment
        if: ${{ always() && steps.abi.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_ID: ${{ steps.old_comment.outputs.comment-id }}
        with:
          github-token: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = fs.readFileSync(process.env.RUNNER_TEMP + '/swift-abi-report.txt', 'utf8');
            if (report.length > 60000) {
              report = report.slice(0, 60000) + '\n...';
            }

            const body = `<!-- swift-abi-check comment -->
            This PR breaks the Swift ABI of ExpoModulesCore or ExpoModulesJSI. Apps that use an older precompiled module with this version will crash at launch.

            \`\`\`
            ${report}
            \`\`\`

            The full output is in the [workflow run](${runUrl}).
            `;

            if (process.env.COMMENT_ID) {
              await github.rest.issues.updateComment({
                comment_id: process.env.COMMENT_ID,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
      - name: 💬 Delete the ABI check comment
        if: ${{ steps.abi.outcome == 'success' && steps.old_comment.outputs.comment-id != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          script: |
            await github.rest.issues.deleteComment({
              comment_id: '${{ steps.old_comment.outputs.comment-id }}',
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
